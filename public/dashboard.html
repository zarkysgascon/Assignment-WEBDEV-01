<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - ReSell Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="resell-app.css">
</head>
<body class="dashboard-body">
  <nav class="navbar navbar-light bg-light px-3">
    <span class="navbar-brand">ReSell Pro</span>
    <button id="logoutBtn" class="btn btn-danger btn-sm">Logout</button>
  </nav>

  <div class="container mt-4">
    <h2>Welcome, <span id="userName"></span></h2>
    <div class="card p-3 mt-3">
      <p><strong>Full Name:</strong> <span id="userFullName"></span></p>
      <p><strong>Email:</strong> <span id="userEmail"></span></p>
      <p><strong>Join Date:</strong> <span id="userJoinDate"></span></p>
    </div>
  </div>

  <script src="scripts/dashboard.js"></script>
</body>
</html>
