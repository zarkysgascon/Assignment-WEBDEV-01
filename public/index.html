<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReSell Pro - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="resell-app.css">
</head>
<body class="auth-body d-flex align-items-center justify-content-center">
  <div class="container" style="max-width: 400px;">
    <h1 class="text-center mb-3">ReSell Pro</h1>
    <div id="messageContainer" class="alert d-none"></div>
    <form id="loginForm" class="p-3 border rounded bg-white">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
      <p class="mt-3 text-center">
        <a href="#" data-bs-toggle="modal" data-bs-target="#signupModal">Create Account</a>
      </p>
    </form>
  </div>

  <!-- Signup Modal -->
  <div class="modal fade" id="signupModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Sign Up</h5></div>
        <div class="modal-body">
          <div id="modalMessageContainer" class="alert d-none"></div>
          <form id="signupForm">
            <input id="signupFirstname" class="form-control mb-2" placeholder="First Name">
            <input id="signupLastname" class="form-control mb-2" placeholder="Last Name">
            <input id="signupEmail" type="email" class="form-control mb-2" placeholder="Email">
            <input id="signupBirthdate" type="date" class="form-control mb-2">
            <input id="signupPassword" type="password" class="form-control mb-2" placeholder="Password">
            <input id="signupRepassword" type="password" class="form-control mb-3" placeholder="Confirm Password">
            <button type="button" id="signupSubmitBtn" class="btn btn-success w-100">Sign Up</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scripts/index.js"></script>
</body>
</html>
